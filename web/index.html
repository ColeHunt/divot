<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1712" />
    <meta name="description" content="Track rounds, courses and scores with your friends." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS reads this for "Add to Home Screen" directly rather than the web
         manifest's icons, and won't reliably rasterize an SVG there, so this
         is a pre-rendered PNG rather than a link to icon.svg. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Fraunces for the wordmark and hero headings only — everything else stays
         the system ui-rounded font. A serif display face paired with a rounded
         sans is what turns "Divot" from a label into a wordmark. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No viewport-fit=cover, deliberately. Asking to cover means laying the
         page out across the whole web view and reserving the insets ourselves
         in CSS — but a standalone home-screen app on iOS lays out against the
         safe area anyway while still reporting cover-mode insets, so the page
         ends up reserving space that the frame has already reserved and the
         tab bar sits two home indicators off the bottom. Without it the
         layout viewport *is* the safe area: nothing to reserve, nothing to
         disagree about, and iOS paints the insets with the document canvas
         (see body.has-tabbar in styles.css, which is what colours the strip
         under the tab bar). "black" rather than black-translucent for the
         same reason — the status bar is the frame's, not ours to draw under. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Divot" />
    <title>Divot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
