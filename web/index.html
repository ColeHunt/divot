<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1712" />
    <meta name="description" content="Track rounds, courses and scores with your friends." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='80' text-anchor='middle'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No viewport-fit=cover, deliberately. Asking to cover means laying the
         page out across the whole web view and reserving the insets ourselves
         in CSS — but a standalone home-screen app on iOS lays out against the
         safe area anyway while still reporting cover-mode insets, so the page
         ends up reserving space that the frame has already reserved and the
         tab bar sits two home indicators off the bottom. Without it the
         layout viewport *is* the safe area: nothing to reserve, nothing to
         disagree about, and iOS paints the insets with the document canvas
         (see body.has-tabbar in styles.css, which is what colours the strip
         under the tab bar). "black" rather than black-translucent for the
         same reason — the status bar is the frame's, not ours to draw under. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Divot" />
    <title>Divot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
