<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2b20"/>
      <stop offset="100%" stop-color="#0d1712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="10%" r="75%">
      <stop offset="0%" stop-color="#e8b34d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8b34d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>

  <!-- ground, seen side-on: soil below, turf on top, with a clean bite
       taken out where the club just struck -->
  <rect x="0" y="70" width="100" height="20" fill="#2a1c12"/>
  <rect x="0" y="61" width="34" height="9" rx="2" fill="#1f5c3c"/>
  <rect x="62" y="61" width="38" height="9" rx="2" fill="#1f5c3c"/>

  <!-- the club, following through just past impact -->
  <g transform="translate(46,42) rotate(34)">
    <path d="M2 -2 L-2 -50" fill="none" stroke="#cfd8d2" stroke-width="4" stroke-linecap="round"/>
    <path d="M2 -3 L18 2 L21 15 L4 18 Z" fill="#dfe6e1" stroke="#9aa39c" stroke-width="1.7" stroke-linejoin="round"/>
  </g>

  <!-- the chunk of turf it just took, still in the air -->
  <g transform="translate(26,32) rotate(-28)">
    <rect x="-11" y="-4" width="22" height="14" rx="2" fill="#2a1c12"/>
    <rect x="-11" y="-4" width="22" height="6" rx="2" fill="#47c98a"/>
  </g>
</svg>
